  procedure_body_site_code:
    name: procedure_body_site_code
    description: "Indicate the ICD-O-3 topography code or UBERON code for the anatomic location of the procedured when it occured. Please use C80.9 if the anatomic location of the procedure is Unknown."
    title: Procedure Body Site Code
    notes:
    - 'Refer to the International Classification of Diseases for Oncology, 3rd Edition
      (WHO ICD-O-3) manual for guidelines at https://apps.who.int/iris/handle/10665/42344'
    examples:
    - value: C50.1
    - value: C18
    exact_mappings:
    - ARGO.v1.34:surgery.surgery_site
    - FHIR.v5.0.0:Procedure.bodySite.coding.code
    - mCODE.v4.0.0:Specimen.collection.bodySite
