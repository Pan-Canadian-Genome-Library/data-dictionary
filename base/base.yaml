  anatomical_site_irradiated_code:
    name: anatomical_site_irradiated_code
    description: "Indicate the ICD-O-3 topography code or UBERON code for the anatomic location where radiation therapy was administered.\n Please use C80.9 if the anatomic location is Unknown. Provide code in Compact URI (CURIE) pattern.\n\n Refer to the International Classification of Diseases for Oncology, 3rd Edition (WHO ICD-O-3) manual for guidelines at https://apps.who.int/iris/handle/10665/42344\n\n UBERON URL: http://purl.obolibrary.org/obo/UBERON_{code}"
    title: Anatomical Site Irradiated Code
    comments:
    - Refer to the International Classification of Diseases for Oncology, 3rd Edition
      (WHO ICD-O-3) manual for guidelines at https://apps.who.int/iris/handle/10665/42344
    examples:
    - value: C50.1
    - value: C18
    exact_mappings:
    - ARGO.v1.34:radiation.anatomical_site_irradiated_code
