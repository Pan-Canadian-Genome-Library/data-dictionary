    description: "Data format of files.\nIf 'analysisType' is 'sequenceExperiment', 'fileType' options are : 'BAM','FASTQ'\nIf 'analysisType' is 'sequenceAlignment', 'fileType' options are : 'BAM','CRAM','BAI','CRAI'\nIf 'analysisType' is 'variantCall', 'fileType' options are : 'VCF','TBI'"
    title: FileType
    exact_mappings:
    - ARGO:files.format
    - EGA:ANALYSIS/FILES/FILE@filetype
    range: string
    required: true
  fileAccess:
    name: fileAccess
    description: The permission level of a file for public access.
    title: FileAccess
    exact_mappings:
    - ARGO:fileAccess
    range: file_access_menu
    required: true
  workflow_name:
    name: workflow_name
    description: The name of the genomic data processing workflow used for data analysis.
    title: Workflow Name
    range: string
    required: true
  workflow_version:
    name: workflow_version
    description: 'The version of the workflow or pipeline being used. '
    title: Workflow Version
    range: string
    required: false
  workflow_url:
    name: workflow_url
    description: A URL linking to the workflow's repository or documentation. This
      could be a reference to a GitHub repository, a website where the workflow is
      described, or documentation on how to run the workflow.
    title: Workflow Url
    range: string
    required: false
  duo_permission:
    name: duo_permission
    description: Select one of the Data Use Ontology (DUO) codes in Compact URI (CURIE)
      pattern to indicate permitted uses or focused areas of research for the Study
      data.
    title: Duo Permission
    exact_mappings:
    - CQDG:duo_permission
    range: duo_permission_menu
    required: true
  duo_modifier:
    name: duo_modifier
    description: Collection of Data Use Ontology (DUO) codes in Compact URI (CURIE)
      pattern to add requirements, limitations, or prohibitions within the permitted
      boundary for the Study data.
    title: Duo Modifier
    exact_mappings:
    - CQDG:duo_modifier
    range: duo_modifier_menu
    required: false
    multivalued: true
  disease_specific_modifier:
    name: disease_specific_modifier
    description: "If the permission is DUO:0000007 (disease specific research), then MONDO codes must be provided to specify which disease(s) apply.\nTo include multiple values, separate values with a pipe delimiter '|' within"
    title: Disease Specific Modifier
    examples:
    - value: MONDO:0000001
    range: string
    required: false
    multivalued: true
    pattern: ^MONDO:\d{7}$
  submitter_sociodem_id:
    name: submitter_sociodem_id
    description: Unique identifier for the sociodemographic record, assigned by the
      data provider.
    title: Submitter Sociodem Id
    examples:
    - value: '90234'
    - value: BLD_participant_89
    - value: AML-90
    range: string
    required: true
    pattern: ^[A-Za-z0-9\-\._]{1,64}$
  age_at_sociodem_collection:
    name: age_at_sociodem_collection
    description: Age (in days) of the participant at the time of sociodemographic
      data collection
    title: Age At Sociodem Collection
    notes: '

      If projects do not have the exact date of birth, they may report an approximate
      age (in days) using the year of birth and year of study collection.
      If left empty, must populate \"age_at_sociodem_collection_missing_reason\"
      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: integer
    required: true
  age_at_sociodem_collection_missing_reason:
    name: age_at_sociodem_collection_missing_reason
    description: "Reason for why `age_at_sociodem_collection` is not provided"
    title: Age At Sociodem Collection Missing Reason
    notes: '

      If \"age_at_sociodem_collection\"left empty, must be populated

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: age_at_sociodem_collection_missing_reason_menu
    required: true
  sociodem_date_collection:
    name: sociodem_date_collection
    description: "Many sociodemographic variables are social constructs, and the way\
      \ participants self-identify may evolve over time. \nPlease indicate the actual\
      \ date when the data was collected in format: YYYY, if available."
    title: Sociodem Date Collection
    notes: '
      When the exact date is unknown it can be approximated based on the study''s
      year of commencement.
      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
    pattern: ^(?:\d{4})$|^Missing \- Unknown$|^Missing
      \- Not collected$|^Missing \- Not provided$|^Missing \- Restricted access$
  race_another_racial_category:
    name: race_another_racial_category
    description: A response which does not fall into any of the previous racial reporting
      categories (e.g., Pacific Islander, Indigenous identities outside of North America,
      etc.).
    title: Race Another Racial Category
    notes: '

      race_another_racial_category must be populated when race is "Another Racial
      Category"

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
  race_collect_method:
    name: race_collect_method
    description: "Studies must report how race data was collected.\nThis is necessary to enable data aggregation, harmonization, and reproducibility.\nResponses from prospective projects should always be self-identified.\nTo respect participants' autonomy and right to self-determination, as well as to avoid conflating differences in (genetic) population structure with socially constructed racial categories, responses that were self-identified should not be aggregated with responses that were socially assigned or derived."
    title: Race Collect Method
    notes: 'Definitions and examples of methods of collections are provided in the PCGL\n. Guidance Document for Participant Sociodemographic Data v1.0.'
    range: race_collect_method_menu
    required: true
  gender_another_gender:
    name: gender_another_gender
    description: A response which does not fall into any of the previous gender reporting
      categories.
    title: Gender Another Gender
    notes: '

      gender_another_gender must be populated when gender is "Another Gender"

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
  gender_collect_method:
    name: gender_collect_method
    description: 'Studies must report how the gender data was collected. This is necessary
      to enable data aggregation, harmonization, and reproducibility. '
    title: Gender Collect Method
    notes: '

      Definitions and examples of methods of collections are provided in the PCGL
      Guidance Document for Participant Sociodemographic Data v1.0.

      '
    range: gender_collect_method_menu
    required: true
  ethnicity_another_category:
    name: ethnicity_another_category
    description: A response which does not fall into any of the previous categories.
      For example, a response of “Other” from retrospective studies. Prospective projects
      should instead allow participants to freely self-identify.
    title: Ethnicity Another Category
    notes: '

      ethnicity_another_category must be populated when ethnicity is “Another Ethnic or Cultural Origin”.

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
  ethnicity_collect_method:
    name: ethnicity_collect_method
    description: 'Studies must report how the ethnicity data was collected. This is
      necessary to enable data aggregation, harmonization, and reproducibility. '
    title: Ethnicity Collect Method
    notes: '

      Definitions and examples of methods of collections are provided in the PCGL
      Guidance Document for Participant Sociodemographic Data.

      '
    range: ethnicity_collect_method_menu
    required: true
  sex_another_category:
    name: sex_another_category
    description: 'A response which does not fall into any of the previous categories. '
    title: Sex Another Category
    notes: '

      sex_another_category must be populated when sex is "Another Sex".

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
  sex_collect_method:
    name: sex_collect_method
    description: 'Studies must report how the sex_at_birth data was collected. This
      is necessary to enable data aggregation, harmonization, and reproducibility. '
    title: Sex Collect Method
    notes: '

      Definitions and examples of methods of collections are provided in the PCGL
      Guidance Document for Participant Sociodemographic Data.

      '
    range: sex_collect_method_menu
    required: true
  education:
    name: education
    description: "Refers to the highest level of education that a person has successfully completed.\nSuccessful completion of a level of education refers to the achievement of the learning objectives of that level, typically validated through the assessment of acquired knowledge, skills, and competencies.\n[REF: Statistics Canada Departmental Standard, Educational attainment of person, May 26, 2021].\n'Missing - Not applicable' is provided as a valid response option when the question is not appropriate to ask (for example, newborn studies).\nThis response option should NOT be provided to adult participants."
    title: Education
    notes: '

      "PCGL guidance documents provide further detail (e.g., PCGL Reference Survey
      v1.0, and PCGL Guidance Document for Participant Sociodemographic Data v1.0)

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: education_menu
    required: true
  education_collect_method:
    name: education_collect_method
    description: 'Studies must report how the education data was collected. This is
      necessary to enable data aggregation, harmonization, and reproducibility. '
    title: Education Collect Method
    notes: '

      Definitions and examples of methods of collections are provided in the PCGL
      Guidance Document for Participant Sociodemographic Data.

      '
    range: education_collect_method_menu
    required: true
  personal_income:
    name: personal_income
    description: "Personal annual income from all sources after taxes.\n'Missing - Not applicable' is provided as a valid response option when the question of personal income is not appropriate to ask (for example, newborn studies).\nThis response option should NOT be provided to adult participants."
    title: Personal Income
    notes: '

      "PCGL guidance documents provide further detail (e.g., PCGL Reference Survey
      v1.0, and PCGL Guidance Document for Participant Sociodemographic Data v1.0)

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: personal_income_menu
    required: false
  personal_income_collect_method:
    name: personal_income_collect_method
    description: "Studies must report how the personal_income data was collected.\nThis is necessary to enable data aggregation, harmonization, and reproducibility.\n'Missing - Not applicable' is provided as a valid response option when the question of income is not appropriate to ask (for example, newborn studies).\nThis response option should NOT be provided to adult participants."
    title: Personal Income Collect Method
    notes: '

      Definitions and examples of methods of collections are provided in the PCGL
      Guidance Document for Participant Sociodemographic Data.

      '
    range: personal_income_collect_method_menu
    required: false
  geographic_location:
    name: geographic_location
    description: "Refers to the person's current, usual place of residence, derived from the postal code at their current address of residence."
    title: Geographic Location
    notes: '

      "PCGL guidance documents provide further detail (e.g., PCGL Reference Survey
      v1.0, and PCGL Guidance Document for Participant Sociodemographic Data v1.0)

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
    pattern:  ^[A-Za-z][0-9][A-Za-z]([0-9][A-Za-z][0-9])?$|^Missing \- Unknown$|^Missing
      \- Not collected$|^Missing \- Not provided$|^Missing \- Restricted access$
  geographic_location_additional:
    name: geographic_location_additional
    description: When postal code is less specific, additional information may be
      reported.
    title: Geographic Location Additional
    range: string
    required: true
  geographic_location_collect_method:
    name: geographic_location_collect_method
    description: 'Studies must report how the geographic_location data was collected.
      This is necessary to enable data aggregation, harmonization, and reproducibility. '
    title: Geographic Location Collect Method
    notes: '

      Definitions and examples of methods of collections are provided in the PCGL
      Guidance Document for Participant Sociodemographic Data.

      '
    range: geographic_location_collect_method_menu
    required: true
  sociodem_question:
    name: sociodem_question
    description: Indicate whether the questions asked for the sociodemographic variable
      follow the PCGL reference question and standard reporting categories.
    title: Sociodem Question
    range: sociodem_question_menu
    required: true
  sociodem_question_detail:
    name: sociodem_question_detail
    description: Report the questions asked for the sociodemographic variable, including
      the provided response options/reporting categories if it does not follow the
      PCGL reference question and standard reporting categories.
    title: Sociodem Question Detail
    notes: '
      "The sociodem_question_detail field provides additional context and is conditionally
      required based on the value of sociodem_question:

      If sociodem_question is ""PCGL reference question"", please indicate the version
      of the PCGL reference question used.

      If sociodem_question is ""Another question"", please provide the exact question
      text used to collect the variable, including the response options or reporting 
      categories made available to participants."
      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: true
  sociodem_notes:
    name: sociodem_notes
    description: Studies may choose to report whether potential bias may exist due
      to the way reporting categories were defined and handled.
    title: Sociodem Notes
    examples:
    - value: "For example, in the Canadian Census, the order of the provided\
        \ response options for ethnicity were shown to influence number of received\
        \ responses per reporting option. \n\nOther examples may include inclusion/exclusion\
        \ criteria based on sociodemographic variables."
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: string
    required: false
  radiation_modality_code:
    name: radiation_modality_code
    description: 'Indicate NCIt code to denote the modality of radiation therapy.

      Provide code in Compact URI (CURIE) pattern.'
    title: Radiation Modality Code
    examples:
    - value: NCIT:C28039
    related_mappings:
    - FHIR.v5.0.0:Procedure.code.coding.system:Procedure.code
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/procedure-definitions.html#Procedure.code"
    exact_mappings:
    - Phenopackets.v2.0:RadiationTherapy.modality
    range: string
    required: true
    pattern: ^NCIT:[C]\d+$
  radiation_modality_term:
    name: radiation_modality_term
    description: Provide the standardized and human readable term derived from the
      coding system associated with the radiation modality code.
    title: Radiation Modality Term
    examples:
    - value: Electron Beam
    range: string
    required: false
    exact_mappings:
    - FHIR.v5.0.0:Procedure.code.coding.display
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/procedure-definitions.html#Procedure.code"
  exposure_code:
    name: exposure_code
    description: 'Provide the standardized codes from SNOMED CT, ExO, LOINC, ECTO to represent
      the type of exposure.

      Provide code in Compact URI (CURIE) pattern.

      '
    title: Exposure Code
    notes: '

      SNOMED-CT URL:

      http://snomed.info/id/{code}


      ExO URL:

      http://purl.obolibrary.org/obo/ExO_{code}


      LOINC URL:

      https://loinc.org/{code}

      ECTO URL:
      http://purl.obolibrary.org/obo/ECTO_{code}
      '
    examples:
    - value: LOINC:43164-0
    range: string
    required: true
    pattern: ^snomedct:(\w+)?\d+$|^ExO:\d{7}$|^LOINC:(\d|\w)+-\d$|^ECTO:\d{7}$
  exposure_term:
    name: exposure_term
    description: Provide the standardized and human readable term derived from the
      coding system associated with the exposure_code
    title: Exposure Term
    examples:
    - value: Alcohol use
    range: string
    required: false
  exposure_status:
    name: exposure_status
    description: Provide the status of the exposure
    title: Exposure Status
    range: exposure_status_menu
    required: true
  age_at_exposure:
    name: age_at_exposure
    description: 'Age (in days) when the participant was exposed (or first exposed)        '
    title: Age At Exposure
    range: integer
    required: false
  exposure_duration:
    name: exposure_duration
    description: "Duration of exposure period in days"
    title: Exposure Duration
    range: integer
    required: false
  exposure_amount:
    name: exposure_amount
    description: Provide intensity, quantity or frequency of the exposure
    title: Exposure Amount
    notes: "\nProvide context-appropriate unit. \nE.g, drinks/week, cigarettes/day,\
      \ hours/week\n"
    range: decimal
    required: false
  exposure_unit:
    name: exposure_unit
    description: Unit associated with exposure_amount
    title: Exposure Unit
    examples:
    - value: drinks/day
    range: string
    required: false
  molecule_type_code:
    name: molecule_type_code
    description: 'Indicate NCIT or SO code to denote the type of source material used
      for sequencing and analysis.

      Provide code in Compact URI (CURIE) pattern.'
    title: Molecule Type Code
    examples:
    - value: NCIT:C449
    - value: NCIT:C812
    - value: NCIT:C80376
    - value: SO:0000991
    - value: SO:0000234
    - value: SO:0001877
    exact_mappings:
    - Beacon.v2.2.0:biosample.sample_type
    - CQDG:Sample.Registration:sample_type
    - GA4GH.Experiment.Metadata.Checklist:molecule_type
    - Phenopackets.v2.0:Biosample:sample_type
    range: string
    required: true
    pattern: ^NCIT:C\d+$|^SO:\d{7}$
  molecule_type_term:
    name: molecule_type_term
    description: Provide the standardized and human readable term derived from the
      coding system associated with molecule type code.
    title: Molecule Type Term
    examples:
    - value: DNA
    range: string
    required: false
  experiment_design:
    name: experiment_design
    description: The high-level experiment design including layout, protocol.
    title: Experiment Design
    notes: "N/A"
    exact_mappings:
    - GA4GH.Experiment.Metadata.Checklist:design_description
    range: string
    required: false
  assay_type_code:
    name: assay_type_code
    description: 'Indicate OBI code to provide the sequencing technique intended for
      the library for sequencing data.

      Provide code in Compact URI (CURIE) pattern.'
    title: Assay Type Code
    notes: '

      E.g,

      OBI:0002117 (whole genome sequencing assay)

      OBI:0002118 (exome sequencing assay)

      OBI:0001922 (microRNA profiling by high throughput sequencing assay)

      OBI:0002764 (single-cell ATAC-seq)

      OBI:0002440 (Hi-C assay)

      OBI:0000748 (bisulfite sequencing assay)

      OBI:0000716 (ChIP-seq assay)"

      '
    examples:
    - value: OBI:0002117
    exact_mappings:
    - Beacon.v2.2.0:runs.libraryStrategy
    - GA4GH.Experiment.Metadata.Checklist:assay_type
    range: string
    required: true
    pattern: ^OBI:\d{7}$
  assay_type_term:
    name: assay_type_term
    description: Provide the standardized and human readable term derived from the
      coding system associated with the assay type code.
    title: Assay Type Term
    notes: '

      E.g,

      OBI:0002117 (whole genome sequencing assay)

      OBI:0002118 (exome sequencing assay)

      OBI:0001922 (microRNA profiling by high throughput sequencing assay)

      OBI:0002764 (single-cell ATAC-seq)

      OBI:0002440 (Hi-C assay)

      OBI:0000748 (bisulfite sequencing assay)

      OBI:0000716 (ChIP-seq assay)"

      '
    examples:
    - value: whole genome sequencing assay
    range: string
    required: false
  instrument:
    name: instrument
    description: 'Provide detailed information about the sequencing platform or technology
      used, including the name and/or model number of the specific instrument. Whenever
      possible, specify the exact model or revision rather than the general manufacturer
      name. It is recommended to use standardized terminology by including the appropriate
      OBI (Ontology for Biomedical Investigations) code and term to ensure precision.


      Use the format: OBI code in CURIE format (OBI term)
      '
    title: Instrument
    notes: '

      Please make sure to include a space between the CURIE and the opening parenthesis.

      '
    examples:
    - value: OBI:0002752 (Oxford Nanopore PromethION)
    - value: OBI:0000759 (Illumina)
    - value: OBI:0002630 (Illumina NovaSeq 6000)
    - value: OBI:0002012 (PacBio RS II)
    exact_mappings:
    - GA4GH.Experiment.Metadata.Checklist:instrument
    range: string
    required: true
    pattern: ^OBI:\d{7} \(.*\)$
  instrument_metadata:
    name: instrument_metadata
    description: Captures metadata about sequencing instrument usage (e.g. instruments
      parameters and usage conditions)
    title: Instrument Metadata
    exact_mappings:
    - GA4GH.Experiment.Metadata.Checklist:instrument_metadata
    range: string
    required: false
  sequencing_protocol:
    name: sequencing_protocol
    description: 'Set of rules which guides how the sequencing protocol was followed.
      Change-tracking services such as Protocol.io or GitHub are encouraged instead
      of dumping free text in this field.

      E.g, https://www.protocols.io/view/environmental-dna-edna-metabarcoding-protocol-for-rm7vzy3q2lx1/v1'
    title: Sequencing Protocol
    exact_mappings:
    - GA4GH.Experiment.Metadata.Checklist:sequencing_protocol
    range: string
    required: false
  file_r1:
    name: file_r1
    description: Name of the sequencing file containing reads from the first end of
      a sequencing run.
    title: File R1
    notes: Any string value. Must match a fileName identified in the files section.
    exact_mappings:
    - ARGO:read_groups.file_r1
    range: string
    required: true
  file_r2:
    name: file_r2
    description: Name of the sequencing file containing reads from the second end
      of a paired-end sequencing run. Required if and only if paired-end sequencing
      was done.
    title: File R2
    notes: Any string value or null. Must match a fileName identified in the files
      section.
    exact_mappings:
    - ARGO:read_groups.file_r2
    range: string
    required: false
  library_name:
    name: library_name
    description: Name of a sequencing library made from a molecular sample or a sample
      pool (multiplex sequencing).
    title: Library Name
    notes: Any string value.
    exact_mappings:
    - ARGO:read_groups.library_name
    - GA4GH.Experiment.Metadata.Checklist:library_extra_id
    range: string
    required: true
  library_layout:
    name: library_layout
    description: Indicate whether the library was built as paired-end or single-end
      if applicable.
    title: Library Layout
    exact_mappings:
    - Beacon.v2.2.0:runs.libraryLayout
    - GA4GH.Experiment.Metadata.Checklist:library_layout
    range: library_layout_menu
    required: true
  platform_unit:
    name: platform_unit
    description: Unique identifier for each read group. For example, Illumina has
      format {FLOWCELL_BARCODE}.{LANE}.{SAMPLE_BARCODE}. The {FLOWCELL_BARCODE} refers
      to the unique identifier for a particular flow cell. The {LANE} indicates the
      lane of the flow cell and the {SAMPLE_BARCODE} is a sample/library-specific
      identifier. For non-multiplex sequencing, platform unit and read group have
      a one-to-one relationship.
    title: Platform Unit
    notes: Any string value.
    exact_mappings:
    - ARGO:read_groups.platform_unit
    range: string
    required: true
  library_description:
    name: library_description
    description: Description of the nucleotide sequencing library, including targeting
      information, spot, gap descriptors, and any other information relevant to its
      construction
    title: Library Description
    notes: Any string value.
    exact_mappings:
    - GA4GH.Experiment.Metadata.Checklist:library_description
    range: string
    required: false
  read_group_id_in_bam:
    name: read_group_id_in_bam
    description: Optional field indicating the @RD ID in the BAM. If submitted, this
      will be used to map the @RG ID in the BAM header to the submitter_read_group_id
      in the payload. After submission, the @RG ID in the payload will be used for
      all future headers. This cannot be submitted for FASTQ files.
    title: Read Group Id In Bam
    notes: Any string value.
    exact_mappings:
    - ARGO:read_groups.read_group_id_in_bam
    range: string
    required: false
    pattern: ^[a-zA-Z0-9\-_:\.']+$
  read_length_r1:
    name: read_length_r1
    description: Length of sequencing reads in file_r1; this corresponds to the number
      of sequencing cycles of the first end.
    title: Read Length R1
    exact_mappings:
    - ARGO:read_groups.read_length_r1
    range: integer
    required: false
    minimum_value: 20
  read_length_r2:
    name: read_length_r2
    description: Length of sequencing reads in file_r2; this corresponds to the number
      of sequencing cycles of the second end.
    title: Read Length R2
    exact_mappings:
    - ARGO:read_groups.read_length_r2
    range: integer
    required: false
    minimum_value: 20
  insert_size:
    name: insert_size
    description: For paired-end sequencing, the average size of sequences between
      two sequencing ends. Required only for paired-end sequencing.
    title: Insert Size
    exact_mappings:
    - ARGO:read_groups.insert_size
    - GA4GH.Experiment.Metadata.Checklist:insert_size
    range: integer
    required: false
    minimum_value: 0
  studyId:
    name: studyId
    description: Unique identifier of the study.
    title: StudyId
    notes: Added as a redundancy measure to prevent submission errors. Clinical API
      will check study_id against user's selection. Also duplicates field study_id
      in Participant b/c SONG's rigidity to rename
    exact_mappings:
    - ARGO.v1.34:program_id
    - CQDG:study_id
    range: string
    required: true
  analysisType:
    name: analysisType
    description: Overall type of the analysis. Term chosen from a controlled vocabulary
      (CV) list.
    title: AnalysisType
    exact_mappings:
    - ARGO:analysisType
    - EGA:ANALYSIS/ANALYSIS_TYPE
    range: analysis_type_menu
    required: true
  data_category:
    name: data_category
    description: 'Indicate the category of data produced as outputs from the analysis. '
    title: Data Category
    range: data_category_menu
    required: true
  variant_class:
    name: variant_class
    description: Indicates whether the called variants are germline, somatic, or of
      uncertain classification.
    title: Variant Class
    range: variant_class_menu
    required: false
  variant_calling_strategy:
    name: variant_calling_strategy
    description: Indicate the approach used to identify genetic variants from sequencing
      data, based on the availability of reference samples (e.g., matched normal)
      and the study design.
    title: Variant Calling Strategy
    range: variant_calling_strategy_menu
    required: false
  dataType:
    name: dataType
    description: "Indicates the type of data produced as outputs from the analysis.\nIf 'analysisType' is 'sequenceExperiment', 'dataType' options are : 'Raw Sequencing Reads'\nIf 'analysisType' is 'sequenceAlignment', 'dataType' options are : 'Aligned Reads','Aligned Reads Index'\nIf 'analysisType' is 'variantCall', dataType options are : 'Single Nucleotide Variants (SNVs)','Insertions and Deletions (InDels)','Structural Variations (SVs)','Copy Number Variations (CNVs)','Variant Calls Index'"
    title: DataType
    range: data_type_menu
    required: true
    multivalued: true
  study_name: 
    description: "The official name of the study"
    name: study_name
    range: string
    title: Study Name
    required: true
  study_description:
    description: "A detailed description of the study's purpose, hypothesis, and design."
    name: study_description
    range: string
    title: Study Description
    required: true
  program_name:
    description: "Indicate the overarching program the study belongs to (if applicable)"
    name: program_name
    range: string
    title: Program Name
  keywords:
    description: "List of specific terms that describe the focus and content of the study. In case there are several, place each on separate line."
    name: keywords
    range: string
    title: Keywords
    multivalued: true
  status:
    description: "Indicate if the study is completed or ongoing."
    name: status
    range: status_menu
    title: Status
    required: true
  context:
    description: "Indicate if the study was conducted in a clinical setting or as part of a research project."
    name: context
    range: context_menu
    title: Context
    required: true
  domain:
    description: "List of specific scientific or clinical domains addressed by the study. In case there are several, place each on separate line."
    name: domain
    range: domain_menu
    title: Domain
    required: true
    multivalued: true
  dac_id:
    description: "Unique identifier of the Data Access Committee (DAC) in PCGL to which the study is assigned. This will be supplied by PCGL Admin"
    name: dac_id
    range: string
    title: DAC Id
    required: true
  participant_criteria: 
    description: "Inclusion/exclusion criteria for participants (e.g., specific cancer type, age range)."
    name: participant_criteria
    range: string
    title: Participant Criteria
    multivalued: true
  principal_investigators:
    description: "List of lead researchers responsible for the study.\nIn case there are several, please list each investigator on a separate line in the format:\nFirstName LastName, Affiliation"
    name: principal_investigators
    range: string
    title: Principal Investigators
    required: true
    multivalued: true
    examples:
    - value: "John Doe, Example Research Institute"
  lead_organizations:
    description: "List of institutions or organizations leading the study.\nIn case there are several, please list each lead organization on a separate line using its full official name."
    name: lead_organizations
    range: string
    title: Lead Organizations
    required: true
    multivalued: true
  collaborators:
    description: "List of researchers, institutions or companies involved in the study.\n\nIn case there are several, please list each collaborator on a separate line in the format:\nFirstName LastName (if individual) or Organization full official name, Role"
    name: collaborators
    range: string
    title: Collaborators
    multivalued: true
    examples:
    - value : "Biotech Inc., Industry Partner"
    - value : "Emily John, Data Contributor"
  funding_sources:
    description: "List of organizations or agencies funding the study. \n\nIn case there are several, please list each funding source on a separate line in the format:\nFunder name, Grant number"
    name: funding_sources
    range: string
    title: Funding Sources
    required: true
    multivalued: true
    examples:
    - value: "National Example Foundation, NEF-12345"
    - value: "Example Health Research Council"
  publication_links:
    description: "List of URL links to academic papers or reports associated with the study. \nIn case there are several, please list each publication on a separate line by providing a DOI URL formatted as https://doi.org/ followed by the DOI number."
    name: publication_links
    range: string
    title: Publication Links
    multivalued: true
  dac_name:
    description: Full name of the DAC.
    name: dac_name
    range: string
    title: DAC Name
    required: true
  dac_description:
    description: An in-depth description of the DAC, including its overall purpose, scope and responsibilities.
    name: dac_description
    range: string
    title: DAC Description
    required: true
  contact_name:
    description: "The full name of the primary contact person. Please provide in the format: FirstName LastName"
    name: contact_name
    range: string
    title: Contact Name
    required: true
    examples:
      - value: "Jone Smith"
  contact_email:
    description: Contact email for communication.
    name: contact_email
    range: string
    title: Contact Email
    required: true
  disease_source_text:
    description: 'Free-text disease description as originally recorded in the source system, prior to ontology mapping.'
    name: disease_source_text
    range: string
    title: Disease Source Text
    required: false
  drug_source_text:
    description: 'Free-text drug name or description as recorded in the source, prior to normalization or ontology mapping.'
    name: drug_source_text
    range: string
    title: Drug Source Text
    required: false
  procedure_source_text:
    description: 'Free-text description of the procedure as entered in the source data, before mapping to standardized terms.'
    name: procedure_source_text
    range: string
    title: Procedure Source Text
    required: false
  procedure_body_site_source_text:
    description: 'Free-text description of the anatomical site for a procedure, as originally captured in the source.'
    name: procedure_body_site_source_text
    range: string
    title: Procedure Body Site Source Text
    required: false
  radiation_modality_source_text:
    description: 'Free-text description of the radiation modality as provided in the source record, before mapping to controlled terms.'
    name: radiation_modality_source_text
    range: string
    title: Radiation Modality Source Text
    required: false
  anatomical_site_irradiated_source_text:
    description: 'Free-text description of the anatomical site irradiated, as originally recorded in the source.'
    name: anatomical_site_irradiated_source_text
    range: string
    title: Anatomical Site Irradiated Source Text
    required: false
  phenotype_source_text:
    description: 'Free-text description of a phenotype or clinical feature, prior to ontology mapping.'
    name: phenotype_source_text
    range: string
    title: Phenotype Source Text
    required: false
  comorbidity_source_text:
    description: 'Free-text description of a comorbidity, as recorded in the source system, before mapping to controlled vocabularies.'
    name: comorbidity_source_text
    range: string
    title: Comorbidity Source Text
    required: false
  measurement_source_text:
    description: 'Free-text representation of a measurement, observation, or test, as originally recorded in the source.'
    name: measurement_source_text
    range: string
    title: Measurement Source Text
    required: false
  measurement_unit_source_text:
    description: 'Free-text representation of the unit of measurement as originally recorded in the source system, prior to mapping to a standardized unit ontology (e.g., UO or UCUM). This preserves verbatim units provided by labs or instruments.'
    name: measurement_unit_source_text
    range: string
    title: Measurement Unit Source Text
    required: false
  exposure_source_text:
    description: 'Free-text description of an exposure (e.g., environmental, occupational), prior to mapping to ontology terms.'
    name: exposure_source_text
    range: string
    title: Exposure Source Text
    required: false
  specimen_tissue_source_text:
    description: 'Free-text description of the tissue source for a specimen, as captured in the source system.'
    name: specimen_tissue_source_text
    range: string
    title: Specimen Tissue Source Text
    required: false
  specimen_anatomic_location_source_text:
    description: 'Free-text description of the anatomical location of specimen collection, prior to ontology coding.'
    name: specimen_anatomic_location_source_text
    range: string
    title: Specimen Anatomic Location Source Text
    required: false
  molecular_type_source_text:
    description: 'Free-text description of the molecular analyte type (e.g., DNA, RNA, protein) as captured in the source record.'
    name: molecular_type_source_text
    range: string
    title: Molecular Type Source Text
    required: false
  assay_type_source_text:
    description: 'Free-text description of the assay type used, as originally recorded in the source system.'
    name: assay_type_source_text
    range: string
    title: Assay Type Source Text
    required: false
  instrument_source_text:
    description: 'Free-text description of the sequencing instrument or platform as originally recorded in the source, prior to ontology mapping.'
    name: instrument_source_text
    range: string
    title: Instrument Source Text
    required: false
  library_layout_source_text:
    description: 'Free-text description of the sequencing library layout as originally recorded in the source system.'
    name: library_layout_source_text
    range: string
    title: Library Layout Source Text
    required: false
  language_id:
    description: 'Short form string of the language'
    name: language_id
    range: string
    title: Language Id
    required: true  
    examples:
    - value: "en-ca"
    - value: "fr-ca"
  date_of_birth:
    name: date_of_birth
    title: Date Of Birth
    description: 'Date of birth collected in format: YYYY-MM or YYYY'
    notes: 'Date of birth collected in format: YYYY-MM'
    range: string
    required: true
    pattern: ^(?:\d{4}$|\d{4}-\d{2}$)|^Missing \- Unknown$|^Missing \- Not collected$|^Missing \- Not provided$|^Missing \- Restricted access$
  date_of_birth_collection_method:
    description: "Studies must report how the date_of_birth was collected. This is necessary to enable data aggregation, harmonization, and reproducibility.\n'Self-identified': The participant reported on their own behalf.\n'Derived': When age is calculated (e.g. interval based methods).\n'Administratively collected': Administrative methods of collection, for example through electronic health records, health card, etc.\n'Another method of collection': A response which does not fall into any of the previous reporting categories."
    name: date_of_birth_collection_method
    title: Date Of Birth Collection Method
    range: date_of_birth_collection_method_menu
    required: true
  place_of_birth:
    description: "Refers to the name of the geographic location where the person was born.\nThe geographic location is specified according to geographic boundaries current at the time of data collection, not the geographic boundaries at the time of birth.\n[REF: Statistics Canada Departmental Standard, Place of birth of person, January 11, 2016]"
    name: place_of_birth
    title: Place Of Birth
    range: place_of_birth_menu
    required: false
  pob_outside_canada:
    description: 'A response when a participant selected "Outside of Canada" to the field place_of_birth'
    name: pob_outside_canada
    title: Pob Outside Canada
    range: string
  arrival_in_canada:
    description: 'A response when a participant selected "Outside of Canada" to the field place_of_birth'
    name: arrival_in_canada
    title: Arrival In Canada
    range: arrival_in_canada_menu
  parent1_place_of_birth:
    description: "Refers to the name of the geographic location where the person's parent was born.\nThe geographic location is specified according to geographic boundaries current at the time of data collection, not the geographic boundaries at the time of birth.\n[REF: Statistics Canada Departmental Standard, Place of birth of person, January 11, 2016]"
    name: parent1_place_of_birth
    title: Parent1 Place Of Birth
    range: place_of_birth_menu
  parent1_another_pob:
    description: 'A response when a participant selected "Outside of Canada" to the field parent1_place_of_birth'
    name: parent1_another_pob
    title: Parent1 Another Pob
    range : string
  parent2_place_of_birth:
    description: "Refers to the name of the geographic location where the person's parent was born.\nThe geographic location is specified according to geographic boundaries current at the time of data collection, not the geographic boundaries at the time of birth.\n[REF: Statistics Canada Departmental Standard, Place of birth of person, January 11, 2016]"
    name: parent2_place_of_birth
    title: Parent2 Place Of Birth
    range: place_of_birth_menu
  parent2_another_pob:
    description: 'A response when a participant answered "Outside of Canada" to the field parent2_place_of_birth'
    name: parent2_another_pob
    title: Parent2 Another Pob
    range : string
  first_language:
    description: "Refers to the first language learned at home in childhood and still understood by the person at the time the data was collected.\nIf the person no longer understands the first language learned, the second language learned may be specified.\nFor a person who learned more than one language at the same time in early childhood, more than one entry can be made; or, the language this person spoke most often at home before starting school may be uniquely entered.\n[REF: Statistics Canada Departmental Standard, Mother tongue of person, July 29, 2022]"
    name: first_language
    title: First Language
    range: first_language_menu
  first_language_another_language:
    description: "Refers to the first language learned at home in childhood and still understood by the person at the time the data was collected.\nIf the person no longer understands the first language learned, the second language learned may be specified.\nFor a person who learned more than one language at the same time in early childhood, more than one entry can be made; or, the language this person spoke most often at home before starting school may be uniquely entered.\n[REF: Statistics Canada Departmental Standard, Mother tongue of person, July 29, 2022]"
    name: first_language_another_language
    title: First Language Another Language
    range : string
  knowledge_official_languages:
    description: "Refers to whether a person can conduct a conversation in English, French, or neither language.\nFor a child who has not yet learned to speak, this includes languages that the child is learning to speak at home.\n[REF: Statistics Canada Departmental Standard, Knowledge of official languages of person, December 4, 2015].\nTo include multiple values, separate values with a pipe delimiter '|' ."
    name: knowledge_official_languages
    title: Knowledge Official Languages
    range: knowledge_official_language_menu
    multivalued: true
  knowledge_non_official_language:
    description: 'A response when "Non-official language" was selected for field "knowledge_official_languages".'
    name: knowledge_non_official_language
    title: Knowledge Non Official Language
    range : string
  knowledge_official_language_preference:
    description: 'A response when "Non-official language" was selected for field "knowledge_official_languages".'
    name: knowledge_official_language_preference
    title: Knowledge Official Language Preference
    range: knowledge_official_language_preference_menu
  religion:
    description: "Refers to a person's self-identification as having a connection or affiliation with any religious denomination, group, body, or other religiously defined community or system of belief.\nReligion is not limited to formal membership in a religious organization or group.\nFor infants or children, religion refers to the specific religious group or denomination in which they are being raised, if any.\nPersons without a religious connection or affiliation can self-identify as atheist, agnostic, or humanist, or can provide another applicable response. [REF: Statistics Canada Departmental Standard, Religion of person, April 1, 2021]."
    name: religion
    title: Religion
    range: religion_menu
  religion_free_text_input:
    description: 'A response when "Religious" was selected for field "religion".'
    name: religion_free_text_input
    title: Religion Free Text Input
    range: string
  sexual_orientation:
    description: "Refers to how a person describes their sexual identity.\nFor example, a person may describe their sexuality as heterosexual, lesbian, gay, bisexual or pansexual (or another sexual orientation not included here).\n[REF: Statistics Canada Recommended Standard, Sexual orientation of person, June 13, 2023].\n\n'LGB+': This reporting category includes persons whose reported sexual orientation is lesbian, gay, bisexual, pansexual, or another sexual orientation that is not heterosexual (i.e., a person of minority sexual orientation) [Statistics Canada Recommended Standard, Classification of sexual orientation, June 13, 2023].\n\n'Heterosexual': This reporting category includes persons whose reported sexual orientation is heterosexual (i.e. a person who is not a minority sexual orientation) [Statistics Canada Recommended Standard, Classification of sexual orientation, June 13, 2023].\n\n'Missing - Not applicable': Statistics Canada currently only collects data on sexual orientation from people aged 15 years and older [Statistics Canada Recommended Standard, Sexual orientation of person, June 13, 2023]."
    name: sexual_orientation
    title: Sexual Orientation
    range: sexual_orientation_menu
  transgender:
    description: "A person whose gender identity differs from what is typically associated with the sex they were assigned at birth.\n[REF: https://www.canada.ca/en/women-gender-equality/free-to-be-me/2slgbtqi-plus-glossary.html].\n\n'Missing - Not applicable' is provided as a valid response option when the question of transgender is not appropriate to ask (for example, newborn studies). This response option should NOT be provided to adult participants."
    name: transgender
    title: Transgender
    range: transgender_menu
  disability_status:
    description: "Disability is the result of the interaction between a person's functional limitations and barriers in the environment, including social and physical barriers that make it harder to function day-to-day.\nThus, a person with disability is a person with a social disadvantage that an unsupportive environment imposes on top of their impairment.\n[REF: Statistics Canada, Canadian Survey on Disability, 2022: Concepts and Methods Guide, December 1, 2023]."
    name: disability_status
    title: Disability Status
    range: disability_status_menu
  total_income:
    description: "Refers to the sum of certain incomes before income taxes and deductions, during a specified reference period.\nThe monetary receipts included are those that tend to be of a regular and recurring nature.\n[REF: Statistics Canada Departmental Standard, Total income of person, March 21, 2016]"
    name: total_income
    title: Total Income
    required: true
    range: total_income_menu
  total_income_support:
    description: 'The number of people supported by the value entered in total_income'
    name: total_income_support
    title: Total Income Support
    required: true
    range: integer
  total_income_collect_method:
    description: 'Studies must report how the total_income data was collected. This is necessary to enable data aggregation, harmonization, and reproducibility.'
    name: total_income_collect_method
    title: Total Income Collect Method
    required: true
    range: total_income_collect_method_menu
  employment_status:
    description: "Refers to the labour force status of those during the reference period.\nThis may include those who, during the reference period did any work at all at a job or business (that is, paid work in the context of an employer-employee relationship, self-employment, or persons who did unpaid family work); had a job but were not at work due to factors such as their own illness or disability, personal or family responsibilities, vacation or a labour dispute; or, persons who were not employed during the reference period (including persons who were unemployed as well as those who were not in the labour force).\nParticipants may have multiple employment statuses. All categories selected by the participants should be reported.\n[Statistics Canada Departmental Standard, Employed person, June 21, 2010].\n\n'Missing - Not applicable' is provided as a valid response option when the question of employment_status is not appropriate to ask (for example, newborn studies). This response option should NOT be provided to adult participants.\nTo include multiple values, separate values with a pipe delimiter '|' ."
    name: employment_status
    title: Employment Status
    range: employment_status_menu
    multivalued: true
  another_employment_status:
    description: 'A response which does not fall into any of the previous categories. Provided when "Another status of employment" is selected in "employment_status"'
    name: another_employment_status
    title: Another Employment Status
    range : string
  household_tenure:
    description: "Refers to whether the household (that is, a person or group of persons who occupy the same dwelling) owns or rents their private dwelling.\nThe private dwelling may be situated on rented or leased land or be part of a condominium.\nA household is considered to own their dwelling if some member of the household owns the dwelling even if it is not fully paid for, for example if there is a mortgage or some other claim on it.\nA household is considered to rent their dwelling if no member of the household owns the dwelling, even if the dwelling is provided without cash rent or at a reduced rent, or if the dwelling is part of a cooperative.\n[REF: Statistics Canada Departmental Standard, Tenure of private household, May 17, 2010]"
    name: household_tenure
    title: Household Tenure
    range: household_tenure_menu
  another_household_tenure:
    description: 'A response which does not fall into any of the previous categories. Provided when "Another status of tenure" is selected in "household_tenure"'
    name: another_household_tenure
    title: Another Household Tenure
    range : string
  accommodation_type:
    description: "Refers to the hospitality service provided in a dwelling where a person may reside temporarily or permanently.\n[REF: Statistics Canada Departmental Standards, Classification of residential structures, September 11, 2013; Accommodation type of collective dwelling, September 24, 2021; ]."
    name: accommodation_type
    title: Accommodation Type
    range: accommodation_type_menu
  another_accommodation_type:
    description: 'A response which does not fall into any of the previous categories. Provided when "Another accommodation type" is selected in "accommodation_type"'
    name: another_accommodation_type
    title: Another Accommodation Type
    range : string
  accommodation_duration:
    description: 'Years lived at current location specified in "geographic_location"'
    name: accommodation_duration
    title: Accommodation Duration
    range: accommodation_duration_menu
  accommodation_number_of_occupants:
    description: 'Counting themselves, the number of occupants living concurrently at the location specified in "geographic_location"'
    name: accommodation_number_of_occupants
    title: Accommodation Number Of Occupants
    range: integer

classes:
  base_Participant:
    name: base_Participant
    description: The collection of all data related to a specific individual human
      in the context of a specific study.
    title: Participant
    todos:
    - '{"reference": "Phenopacket / GDC", "status": "v2"}'
    slots:
    - submitter_participant_id
    - age_at_death
    - age_at_enrollment
    - cause_of_death
    - vital_status
    - sex_at_birth
    - sex_collect_method
    - sex_another_category
    slot_usage:
      submitter_participant_id:
        name: submitter_participant_id
        rank: 1
        slot_group: Database Identifiers
      age_at_death:
        name: age_at_death
        rank: 2
        slot_group: Participant
      age_at_enrollment:
        name: age_at_enrollment
        rank: 3
        slot_group: Participant
      cause_of_death:
        name: cause_of_death
        rank: 4
        slot_group: Participant
      vital_status:
        name: vital_status
        rank: 5
        slot_group: Participant
      sex_at_birth:
          name: sex_at_birth
          rank: 6
          slot_group: Participant
      sex_collect_method:
          name: sex_collect_method
          rank: 7
          slot_group: Participant
      sex_another_category:
          name: sex_another_category
          rank: 8
          slot_group: Participant
    unique_keys:
      main:
        unique_key_name: main
        unique_key_slots:
        - submitter_participant_id
    rules:
    - preconditions:
        description: cause_of_death populatable only if vital_status
          is deceased
        slot_conditions:
          vital_status:
            name: vital_status
            equals_string: Deceased
      postconditions:
        slot_conditions:
          cause_of_death:
            name: cause_of_death
            required: false
      elseconditions:
        slot_conditions:
          cause_of_death:
            name: cause_of_death
            value_presence: ABSENT
    - preconditions:
        description: Age_at_death populatable only if vital_status
          is deceased
        slot_conditions:
          vital_status:
            name: vital_status
            equals_string: Deceased
      postconditions:
        slot_conditions:
          age_at_death:
            name: age_at_death
            required: false
      elseconditions:
        slot_conditions:
          age_at_death:
            name: age_at_death
            value_presence: ABSENT
  base_Sociodemographic:
    name: base_Sociodemographic
    description: Captures sociodemographic characteristics of an individual that may
      vary over time and can influence health status, access to care, or disease outcomes.
      These factors are often collected longitudinally and reflect broader social
      determinants of health. The PCGL requires information on eight key sociodemographic
      variables defined by the Canadian Institute for Health Information (CIHI).
    title: Sociodemographic
    slots:
    - submitter_sociodem_id
    - submitter_participant_id
    - age_at_sociodem_collection
    - age_at_sociodem_collection_missing_reason
    - education
    - education_collect_method
    - ethnicity
    - ethnicity_another_category
    - ethnicity_collect_method
    - gender
    - gender_another_gender
    - gender_collect_method
    - geographic_location
    - geographic_location_additional
    - geographic_location_collect_method
    - personal_income
    - personal_income_collect_method
    - race
    - race_another_racial_category
    - race_collect_method
    - sex_another_category
    - sex_at_birth
    - sex_collect_method
    - sociodem_date_collection
    - sociodem_notes
    - sociodem_question
    - sociodem_question_detail
    - date_of_birth
    - date_of_birth_collection_method
    - place_of_birth
    - pob_outside_canada
    - arrival_in_canada
    - parent1_place_of_birth
    - parent1_another_pob
    - parent2_place_of_birth
    - parent2_another_pob
    - first_language
    - first_language_another_language
    - knowledge_official_languages
    - knowledge_non_official_language
    - knowledge_official_language_preference
    - religion 
    - religion_free_text_input
    - sexual_orientation
    - transgender
    - disability_status
    - total_income
    - total_income_support
    - total_income_collect_method
    - employment_status
    - another_employment_status
    - household_tenure
    - another_household_tenure
    - accommodation_type
    - another_accommodation_type
    - accommodation_duration
    - accommodation_number_of_occupants
    slot_usage:
      submitter_sociodem_id:
        name: submitter_sociodem_id
        rank: 1
        slot_group: Database Identifiers
      submitter_participant_id:
        name: submitter_participant_id
        rank: 2
        slot_group: Database Identifiers
      age_at_sociodem_collection:
