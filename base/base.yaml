      coding system associated with the procedure_body_site_code
    title: Procedure Body Site Term
    range: string
    required: false
    exact_mappings:
    - FHIR.v5.0.0:Procedure.bodySite.coding.display
    - Phenopackets.v2.0:Procedure.body_site.label
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/procedure-definitions.html#Procedure.bodySite"
  procedure_code:
    name: procedure_code
    description: "Use code from NCIt, SNOMED-CT, UMLS or CCI to represent the procedure performed. Provide code in Compact URI (CURIE) pattern.\n\nNCIt URL:\nhttp://purl.obolibrary.org/obo/NCIT_{code}\nSNOMED-CT URL:\nhttp://snomed.info/id/{code}\nUMLS URL:\nhttps://uts.nlm.nih.gov/uts/umls/concept/{code}\nCCI URL:\nhttps://www.cihi.ca/en/cci-coding-structure"
    title: Procedure Code
    range: string
    required: true
    pattern: ^NCIT:[C]\d+$|^snomedct:(\w+)?\d+$|^umls:C\d+$|^CCI:[A-Z0-9]([0-9]{2}|[A-Z]{2}){3}(([0-9]{2}|[A-Z]{2})[A-Z0-9]?)?$
    examples:
    - value: NCIT:C51894 
    - value: snomedct:284196006
    - value: umls:C2584994
    - value: CCI:1CA14STCDR
    comments:
    - "Provide code in Compact URI (CURIE) pattern.  NCIt URL: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&code=C<code>\n  SNOMED-CT URL: http://snomed.info/id/<code>\n  UMLS URL: https://uts.nlm.nih.gov/uts/umls/concept/<code> CCI URL:https://www.cihi.ca/en/cci-coding-structure"
    related_mappings:
    - FHIR.v5.0.0:Procedure.code.coding.system:Procedure.code
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/procedure-definitions.html#Procedure.code"
    exact_mappings:
    - Phenopackets.v2.0:Procedure.code.id
  procedure_term:
    name: procedure_term
    description: Provide the standardized and human readable term derived from the
      coding system associated with the procedure_code
    title: Procedure Term
    range: string
    required: false
    exact_mappings:
    - FHIR.v5.0.0:Procedure.code.display
    - Phenopackets.v2.0:Procedure.code.label
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/procedure-definitions.html#Procedure.code"
  submitter_treatment_id:
    name: submitter_treatment_id
    description: Unique identifier of the treatment, assigned by the data provider.
    title: Submitter Treatment Id
