  age_at_death:
    name: age_at_death
    description: Age of participant (in days) at time of death
    title: Age At Death
    range: integer
    required: false
    exact_mappings:
    - ARGO.v1.34:donor.survival_time
    - Phenopackets.v2.0:VitalStatus.survival_time_in_days
    related_mappings:
    - FHIR.v5.0.0:Patient.deceased.dateTime-Patient.birthDate
    - mCODE.v4.0.0:Patient.deceased.dateTime-Patient.birthDate
