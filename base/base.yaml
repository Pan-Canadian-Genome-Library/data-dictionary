    name: measurement_unit
    description: "Provide the ontology of standardized units to indicate units used to record measurement result. Provide code in Compact URI (CURIE) pattern. UO URL: http://purl.obolibrary.org/obo/UO_{code}\n UCUM URL: https://ucum.nlm.nih.gov/ucum-lhc/demo.html"
