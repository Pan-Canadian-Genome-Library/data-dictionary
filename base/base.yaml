    - FHIR.v.5.0.0:Condition.code.coding.code
    - MOHCCN.v3.1:Comorbidity.comorbidity_type_code
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/condition-definitions.html#Condition.code"
