  ethnicity:
    name: ethnicity
    description: "Refers to the ethnic or cultural origins the person's ancestors.\nAncestors may have Indigenous origins, or origins that refer to different countries, or other origins that may not refer to different countries.\nParticipants may have multiple ethnic and/or cultural identities. All categories entered by the participants should be reported.\nTo include multiple values, separate values with a pipe delimiter '|' .\n[REF: Statistics Canada Departmental Standard, Ethnic or cultural origins of person, April 1, 2021]"
    title: Ethnicity
    notes: '"PCGL guidance documents provide further detail (e.g., PCGL Reference Survey
      v1.0, and PCGL Guidance Document for Participant Sociodemographic Data v1.0)


      To include multiple values, separate values with a pipe delimiter ''|'' within
      your file."'
    comments:
    - EDI indicator
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: ethnicity_menu
    required: true
    multivalued: true
  gender:
    name: gender
    description: "Refers to an individual's personal and social identity as a man, woman, or non-binary person (a person who is not exclusively a man or woman).\nA person's gender may differ from their sex at birth, and from what is indicated on their current identification or legal documents such as their birth certificate, passport or driver's license.\nA person's gender may change over time and some people may not identify with a specific gender.\n[REF: Statistics Canada Departmental Standard, Gender of person, October 1, 2021]"
    title: Gender
    notes: '

      PCGL guidance documents provide further detail (e.g., PCGL Reference Survey
      v1.0, and PCGL Guidance Document for Participant Sociodemographic Data v1.0)

      '
    comments:
    - EDI indicator
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    - Phenopackets.v2.0:Individual.gender
    range: gender_menu
    required: true
  race:
    name: race
    description: "Refers to a person who identifies as a visible minority under the Employment Equity Act, and Indigenous Peoples.\nThe Employment Equity Act defines visible minorities as 'persons, other than Aboriginal peoples, who are non-Caucasian in race or non-white in colour'.\nParticipants may have multiple racial identities.\nAll categories selected by the participants should be reported.\nTo include multiple values, separate values with a pipe delimiter '|' .\n[REF: Statistics Canada Departmental Standard, Visible minority of person, August 25, 2021]"
    title: Race
    comments:
    - EDI indicator
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    range: race_menu
    required: true
    multivalued: true
  sex_at_birth:
    name: sex_at_birth
    description: "Refers to sex assigned at birth. Sex at birth is typically assigned based on a person's reproductive system and other physical characteristics; however, sex is also influenced by our physiology, genes, and hormones.\n[REF: Statistics Canada Departmental Standard, Sex at birth of person, October 1, 2021]"
    title: Sex At Birth
    notes: '

      "PCGL guidance documents provide further detail (e.g., PCGL Reference Survey
      v1.0, and PCGL Guidance Document for Participant Sociodemographic Data v1.0)"

      '
    exact_mappings:
    - PCGL.Reference.Survey.v2.0.and.PCGL.Guidance.Document.for.Participant.Sociodemographic.Data.v1.0
    - Phenopackets.v2.0:Individual.sex
    range: sex_at_birth_menu
    required: true
  age_at_phenotype:
