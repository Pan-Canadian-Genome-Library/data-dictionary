  drug_code:
    name: drug_code
    description: "Provide the standardized code from RxNorm, KEGG drug database, PubChem Compound or NCIt to represent the drug.\nProvide code in Compact URI (CURIE) pattern.\nRxNorm URL:\nhttps://rxnav.nlm.nih.gov/REST/rxcui/{code}\nKEGG URL:\nhttps://www.kegg.jp/entry/{code}\nPubChem URL:\nhttps://pubchem.ncbi.nlm.nih.gov/compound/{code}\nNCIt URL:\nhttps://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&code=C{code}"
    title: Drug Code
    range: string
    required: true
    pattern: ^rxnorm:\d{1,8}$|^kegg\.drug:D\d+$|^pubchem\.chem:\d+$|^NCIT:C\d{1,7}$
    examples:
    - value: rxnorm:221058
    - value: kegg.drug:D00123
    - value: pubchem.chem:100101
    - value: NCIT:C138986
    comments:
    - 'Provide code in Compact URI (CURIE) pattern.  RxNorm URL: https://rxnav.nlm.nih.gov/REST/rxcui/{code}  KEGG
      URL: https://www.kegg.jp/entry/{code}  PubChem URL: https://pubchem.ncbi.nlm.nih.gov/compound/{code}  NCIt
      URL: https://ncit.nci.nih.gov/ncitbrowser/ConceptReport.jsp?dictionary=NCI_Thesaurus&code=C{code}'
    related_mappings:
    - ARGO.v1.34:chemotherapy.drug_database:chemotherapy.drug_rxnormcui,chemotherapy.drug_id,hormone_therapy.drug_database:hormone_therapy.drug_rxnormcui,hormone_therapy.drug_id,immunotherapy.drug_database:immunotherapy.drug_rxnormcui,immunotherapy.drug_id
    - FHIR.v5.0.0:MedicationAdministration.medication.code.coding.system:MedicationAdministration.medication.code.coding.code
    - MOHCCN.v3.1:Systemic_therapy.drug_reference_database:Systemic_therapy.drug_reference_identifier
    annotations:
      specifications: "FHIRSpec.v5.0.0:https://hl7.org/fhir/medicationadministration-definitions.html#MedicationAdministration.medication"
  drug_dose_units:
    name: drug_dose_units
    description: "Provide the ontology of standardized units to indicate units used to record drug dose."
    title: Drug Dose Units
    range: string
    pattern: ^UO:\d{7}$
    required: false
    related_mappings:
    - ARGO.v1.34:chemotherapy.chemotherapy_drug_dose_units,hormone_therapy.hormone_drug_dose_units,immunotherapy.immunotherapy_drug_dose_units
    exact_mappings:
    - MOHCCN.v3.1:Systemic_therapy.drug_dose_units
